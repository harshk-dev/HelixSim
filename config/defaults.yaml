run_sim: 0

setting_change: 1

cam_mode: 'origin'

struct_param:
  mass: 1.0
  arm_length: 0.5
  prop_length: 0.25

env_param:
  wind_velocity_x: 0
  wind_velocity_y: 0
  wind_velocity_z: 0
  turbulence_intensity: 0
  gust_frequency: 0
  gravity: 9.81
  atmospheric_pressure: 1

control_param:
  base_rpm: 7626       # Doubled to counteract 4x mass with the same thrust coefficient
  min_rpm: 1500
  max_rpm: 13000       # Raised ceiling so it has headroom to climb and stabilize
  windup_limit: 1000
  esc_latency: 0
  imu_sensor_noise: 0

sim_presets:
  structural_preset: 'quad'
  trajectory_preset: 'hover'

drone_state:
    pos: [0, 0, 0]
    velocity: [0, 0, 0]
    orientation: [0, 0, 0]
    angular_velocity: [0, 0, 0]
    motor_rpm: [0, 0, 0, 0]

thrust_pid_param:
  pos_kp: 1.5
  pos_ki: 0.0
  pos_kd: 0.0
  velo_kp: 1600.0      # Kept at 4x original to move the heavier mass
  velo_ki: 25.0
  velo_kd: 200.0

roll_pid_param:
  pos_kp: 0.15
  pos_ki: 0.0
  pos_kd: 0.15
  angle_kp: 2000.0     # High rotational inertia still requires these heavy PID gains
  angle_ki: 10.0   
  angle_kd: 800.0      

pitch_pid_param:
  pos_kp: 0.15
  pos_ki: 0.0
  pos_kd: 0.15
  angle_kp: 2000.0
  angle_ki: 10.0
  angle_kd: 800.0

yaw_pid_param:
  angle_kp: 3000.0     
  angle_ki: 20.0
  angle_kd: 400.0

hover_param:
  pos_x: 0.0
  pos_y: 0.0
  pos_z: 5.0
  yaw: 0.0

straight_param:
  slope_x: 1.0
  slope_y: 1.0
  slope_z: 0.0
  intercept_x: 0.0
  intercept_y: 0.0
  intercept_z: 10.0
  yaw: 0.0

circular_param:
  radius: 5.0
  height: 5.0
  yaw: 0.0
